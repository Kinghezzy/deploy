name: Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2 # v2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4 # v4

      - name: Run backup
        run: ./scripts/backup.sh
